global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']      # Prometheus internal

  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']       # cAdvisor internal

  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']           # Loki's own metrics

  # Jenkins: requires the "Prometheus metrics" plugin.
  - job_name: 'jenkins'
    metrics_path: '/prometheus'
    static_configs:
      - targets: ['jenkins-local:8080']  # Jenkins internal