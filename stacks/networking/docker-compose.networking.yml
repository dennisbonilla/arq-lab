services:
  # Dynamic reverse proxy: detects containers by labels and routes them.
  traefik:
    image: traefik:latest
    container_name: traefik
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--api.dashboard=true"
      - "--api.insecure=true"     # dashboard without auth: ONLY for local lab
    ports:
      - "80:80"         # routed HTTP traffic
      - "8093:8080"     # Traefik dashboard → http://localhost:8093
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - devops-net-jenkins-and-docker

  # Cloudflare tunnel to expose the lab to the internet without opening ports.
  # Requires a tunnel token (create it in the Cloudflare Zero Trust panel).
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: "${CLOUDFLARE_TUNNEL_TOKEN}"   # read from .env
    networks:
      - devops-net-jenkins-and-docker

networks:
  devops-net-jenkins-and-docker:
    external: true