# ============================================================================
#  httpd.conf - Apache + AEM Dispatcher configuration (HTTP)
# ============================================================================

# --- Port and user ---
Listen 80
ServerName localhost
ServerRoot "/usr/local/apache2"

# --- Base Apache modules we need ---
# These ship with httpd:2.4; you only need to enable them.
LoadModule mpm_event_module    modules/mod_mpm_event.so
LoadModule authz_core_module   modules/mod_authz_core.so
LoadModule mime_module         modules/mod_mime.so
LoadModule log_config_module   modules/mod_log_config.so
LoadModule unixd_module        modules/mod_unixd.so
LoadModule dir_module          modules/mod_dir.so
LoadModule headers_module      modules/mod_headers.so
LoadModule rewrite_module      modules/mod_rewrite.so

# --- OUR dispatcher module (the one we extracted) ---
# This is the key line of the whole project.
LoadModule dispatcher_module   modules/mod_dispatcher.so

# --- User Apache runs as ---
User daemon
Group daemon

# --- Where logs are stored (they go to the container console) ---
ErrorLog /proc/self/fd/2
LogLevel warn
LogFormat "%h %l %u %t \"%r\" %>s %b" common
CustomLog /proc/self/fd/1 common

# --- Root folder where the dispatcher caches content ---
DocumentRoot "/var/www/html"
<Directory "/var/www/html">
    Options FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

# --- Dispatcher configuration ---
# We tell it which rules file to use (the dispatcher.any we'll create now).
<IfModule dispatcher_module>
    DispatcherConfig conf/dispatcher.any
    DispatcherLog    /proc/self/fd/2
    DispatcherLogLevel 3
    # DispatcherNoServerHeader 0
    DispatcherDeclineRoot 0
    DispatcherUseProcessedURL 1
    DispatcherPassError 0
</IfModule>

# --- Make ALL traffic go through the dispatcher ---
<Directory />
    <IfModule dispatcher_module>
        SetHandler dispatcher-handler
    </IfModule>
    Options FollowSymLinks
    AllowOverride None
</Directory>