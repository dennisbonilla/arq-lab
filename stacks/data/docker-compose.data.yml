services:
  # General-purpose database for the lab.
  # (SonarQube has its own Postgres in its stack; this one is for the rest:
  #  Keycloak, external GitLab, test apps, etc.)
  postgres:
    image: postgres:15
    container_name: postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: arqlab
      POSTGRES_PASSWORD: arqlabx-86       # change it; this is only for the lab
      POSTGRES_DB: aem-lab-postgress
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - devops-net-jenkins-and-docker

  # In-memory cache.
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - devops-net-jenkins-and-docker

  # Test SMTP server: captures the emails your apps send
  # and shows them in a web UI, without actually delivering them.
  mailhog:
    image: mailhog/mailhog:latest
    container_name: mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"     # SMTP  (your apps send here)
      - "8025:8025"     # web   (check the emails → http://localhost:8088)
    networks:
      - devops-net-jenkins-and-docker

volumes:
  postgres_data:
  redis_data:

networks:
  devops-net-jenkins-and-docker:
    external: true